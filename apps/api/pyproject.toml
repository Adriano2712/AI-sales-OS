[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-sales-os-api"
version = "0.1.0"
description = "AI Sales OS - API + domain (modular monolith)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<0.31",
  "alembic>=1.13,<2",
  "python-jose[cryptography]>=3.3,<4",
  "redis>=5.1,<6",
  "rq>=2.0,<3",
  "structlog>=24.4,<25",
  "httpx>=0.27,<0.28",
  "beautifulsoup4>=4.12,<5",
  "anthropic>=0.39,<0.40",
  "python-dotenv>=1.0,<2",
  "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "pytest-cov>=5.0,<6",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.7,<0.8",
  "mypy>=1.13,<2",
  "types-python-jose>=3.3,<4",
  "cryptography>=43,<44",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
plugins = ["pydantic.mypy"]
mypy_path = "src"
